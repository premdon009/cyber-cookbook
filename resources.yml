# Single source of truth for every external resource in the cookbook.
# scripts/gen_catalog.py renders docs/resources/*.md from this file,
# scripts/fetch_resources.py clones entries with clone: true into resources/ (git-ignored),
# scripts/check_links.py verifies every url.
#
# Fields
#   name      display name
#   url       where to read / use it
#   repo      git URL (optional) - required when clone: true
#   category  one of the keys in `categories` below
#   level     L0..L5 (lowest level it is useful at)
#   cost      free | freemium | self-hosted
#   platform  linux | windows | both | web | cloud | any
#   team      red | blue | purple | both | ai
#   clone     true -> fetch_resources.py clones it for offline reading
#   note      one line: why / when to use it

categories:
  reference: Reference & reading
  courses: Free courses & books
  awesome: Awesome lists & link hubs
  online-labs: Free online labs & wargames
  self-hosted-labs: Self-hosted vulnerable labs
  blue-tooling: Blue team tooling (open source)
  datasets: Logs, datasets & detection content
  re-exploit: Reverse engineering & binary exploitation
  ai: AI - learning, building, securing
  case-sources: Vulnerability & incident sources

