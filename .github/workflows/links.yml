name: Weekly link check

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Check links
        id: check
        run: |
          set -o pipefail
          uv run python scripts/check_links.py | tee link-report.txt
      - name: Open an issue on dead links
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E '^(FAIL|WARN)' link-report.txt; echo '```'; } > body.md
          gh issue create --title "Dead links found ($(date -u +%F))" --body-file body.md
